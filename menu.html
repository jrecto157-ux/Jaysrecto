<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Menu Board</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .menu-container {
            border: 2px solid #333;
            padding: 10px;
            width: 600px;
            margin: auto;
        }
        .menu-day {
            margin-bottom: 20px;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 10px;
        }
        .menu-day h3 {
            background-color: #f4f4f4;
            padding: 5px;
            border-left: 4px solid #000;
        }
        .menu-day ul {
            list-style-type: none;
            padding: 0;
        }
        .menu-day li {
            margin: 5px 0;
        }
        .highlight {
            font-weight: bold;
            color: #d9534f;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <div class="menu-container">
        <h2>Weekly Menu Board</h2>
        
        <div class="menu-day">
            <h3><span class="highlight">Monday</span></h3>
            <ul>
                <li><span class="highlight">Main Dish:</span> Chicken Adobo</li>
                <li><span class="highlight">Side Dish:</span> Steamed Vegetables</li>
            </ul>
        </div>
        
        <div class="menu-day">
            <h3><span class="highlight">Tuesday</span></h3>
            <ul>
                <li><span class="highlight">Main Dish:</span> Beef Steak</li>
                <li><span class="highlight">Side Dish:</span> Mashed Potatoes</li>
            </ul>
        </div>
        
        <div class="menu-day">
            <h3><span class="highlight">Wednesday</span></h3>
            <ul>
                <li><span class="highlight">Main Dish:</span> Fish Fillet</li>
                <li><span class="highlight">Side Dish:</span> Rice</li>
            </ul>
        </div>
        
        <div class="menu-day">
            <h3><span class="highlight">Drinks</span></h3>
            <table>
                <tr>
                    <th>Drink</th>
                    <th>Price</th>
                </tr>
                <tr>
                    <td>Orange Juice</td>
                    <td>₱30</td>
                </tr>
                <tr>
                    <td>Milk</td>
                    <td>₱20</td>
                </tr>
                <tr>
                    <td>Water</td>
                    <td>₱10</td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
